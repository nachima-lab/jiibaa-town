<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>じぃばぁの町</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf1e8;color:#334c45;font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}header{background:#fffdf7;padding:14px;display:flex;justify-content:space-between;font-weight:bold}main{max-width:760px;margin:auto}canvas{width:100%;display:block;background:#c9e2cb;touch-action:manipulation}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px}button{background:white;border:1px solid #c7d7c9;border-radius:12px;padding:10px;color:#35564a;font-weight:600}button:active{background:#d4e8d9}button:disabled{opacity:.4}.panel{background:#fffdf8;border-radius:16px;padding:14px;margin:6px 10px 20px;min-height:240px}h2{font-size:18px;margin:5px 0 12px}p{font-size:13px;line-height:1.7}.card{border:1px solid #dce6d9;border-radius:12px;padding:12px;margin:9px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#718479;font-size:12px}.log{background:#edf4e9;border-radius:9px;padding:9px;margin:6px 0;font-size:12px}.modal{position:fixed;inset:0;background:#263c3a99;display:none;align-items:center;justify-content:center;padding:15px}.modal>div{background:#fffdf7;padding:18px;border-radius:18px;width:min(420px,100%)}.modal button{display:block;width:100%;margin:6px 0}input{padding:8px;border-radius:8px;border:1px solid #ccd6c9;width:140px}small{font-size:11px;color:#6d8177}</style><header><div>🏡 じぃばぁの町 <small>試作版 0.1</small></div><div id="money">450円</div></header><main><canvas id="cv" width="700" height="460"></canvas><div class="tabs"><button onclick="tab('people')">👴 住人</button><button onclick="tab('farm')">🥬 畑</button><button onclick="tab('shop')">🛒 お店</button><button onclick="tab('diary')">📖 手帳</button></div><div class="panel" id="panel"></div><p class="muted" style="text-align:center">自動保存・バックアップ対応。住人や家をタップして訪問できます。</p></main><div class="modal" id="modal"><div id="dialog"></div></div><script>
const KEY='jiibaa-v01',R=n=>Math.floor(Math.random()*n),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let names=[['たけお','しげる','まさお','きよし'],['はなこ','ふみ','よしえ','きぬ']],acts=['お茶','お菓子','お掃除','おしゃべり'];function newP(i){let sex=R(2),like=R(4),dislike=(like+1+R(3))%4;return{id:i,name:names[sex][R(4)],sex:sex?'♀':'♂',age:73+R(13),like,dislike,mood:60+R(30),friend:20+R(50),talk:R(100),kind:R(100),x:i?500:200,y:290,target:R(4),pause:0,last:{},known:[],color:['#9bafcb','#c88e91','#8fae9c','#c6a078'][R(4)]}}function fresh(){return{cash:450,people:[newP(0),newP(1)],plots:[0,-1],seeds:3,ready:[0,0],items:[],bond:15,logs:['小さな町に、じぃばぁが引っ越してきました。']}}let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||!s.people)s=fresh();let current='people';function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function note(x){s.logs.unshift(x);s.logs=s.logs.slice(0,35);save()}function cash(n){s.cash=Math.max(0,s.cash+n);document.getElementById('money').textContent='💴 '+s.cash.toLocaleString()+'円'}function tab(t){current=t;render()}function render(){cash(0);let h='';if(current==='people'){h='<h2>じぃばぁのおうち</h2><p>住人の気持ちは数字では見えません。お話や行動から想像してみましょう。</p>';s.people.forEach((p,i)=>h+=`<div class="card row"><div><b>${esc(p.name)} ${p.sex}（${p.age}歳）</b><br><small>${p.mood>55?'今日はごきげんそう':'少し元気がなさそう'}</small></div><button onclick="visit(${i})">訪問</button></div>`);h+=`<p>ふたりの関係：${s.bond>45?'仲良し':s.bond<0?'少し気まずい':'顔なじみ'}</p>`}if(current==='farm'){h='<h2>畑と商売</h2><p>種をまいて、20秒ほどで収穫。売上で町を育てられます。</p><div class="grid">';s.plots.forEach((p,i)=>h+=`<div class="card"><b>畑 ${i+1}</b><p>${p===-1?'未開放':p===0?'空き畑':Date.now()<s.ready[i]?'育成中':'収穫できます'}</p><button ${p===-1||p===1&&Date.now()<s.ready[i]?'disabled':''} onclick="plot(${i})">${p===0?'種をまく':p===1?'収穫して売る':'開放待ち'}</button></div>`);h+=`</div><p>種：${s.seeds}個　<button onclick="seed()">種を2個買う 40円</button></p>`}if(current==='shop'){h='<h2>町のお店</h2><p>設備を買うと、町の景色や住人の交流が少しずつ変わります。</p>';[['bench','公園のベンチ',250],['flower','花壇',360],['shogi','将棋台',540],['lamp','街灯',700]].forEach(([id,label,price])=>h+=`<div class="card row"><b>${label}</b><button ${s.items.includes(id)?'disabled':''} onclick="buy('${id}',${price})">${s.items.includes(id)?'購入済み':price+'円'}</button></div>`);h+='<div class="card row"><b>畑を増やす</b><button onclick="expand()">400円</button></div>'}if(current==='diary'){h='<h2>じぃばぁ手帳</h2><p>性格や好みは、お世話を通して少しずつわかります。</p>';s.people.forEach(p=>h+=`<div class="card"><b>${esc(p.name)} ${p.sex}（${p.age}歳）</b><p>${p.known.length?p.known.map(esc).join('、'):'まだ発見したことはありません'}</p></div>`);h+='<h2>町のできごと</h2>'+s.logs.slice(0,12).map(x=>`<div class="log">${esc(x)}</div>`).join('')+'<p><button onclick="backup()">バックアップ保存</button> <button onclick="restore()">バックアップ読込</button></p><button onclick="reset()">最初からやり直す</button>'}document.getElementById('panel').innerHTML=h}function modal(h){document.getElementById('dialog').innerHTML=h;document.getElementById('modal').style.display='flex'}function close(){document.getElementById('modal').style.display='none';render()}function visit(i){let p=s.people[i];modal(`<h2>${esc(p.name)} ${p.sex}（${p.age}歳）</h2><p>「今日は何をしましょうかねぇ」</p><div class="grid">${acts.map((a,j)=>`<button onclick="care(${i},${j})">${['🍵','🍘','🧹','💬'][j]} ${['お茶はいかがですか？','お菓子はいかがですか？','お掃除しましょうか？','少しお話しませんか？'][j]}</button>`).join('')}</div><p>お名前：<input id="rename" value="${esc(p.name)}" maxlength="12"> <button onclick="renameP(${i})">変更</button></p><button onclick="close()">町に戻る</button>`)}function renameP(i){let v=document.getElementById('rename').value.trim();if(v)s.people[i].name=v;save();visit(i)}function care(i,j){let p=s.people[i],rep=Date.now()-(p.last[j]||0)<30000;p.last[j]=Date.now();let score=(j===p.like?2:j===p.dislike?-2:0)-(rep?2:0)+(p.mood<40?-1:0);let n=score>=2?70+R(100):score>=0?20+R(60):-(15+R(65));n=Math.max(-s.cash,n);cash(n);p.mood=Math.max(0,Math.min(100,p.mood+(score>=0?4:-9)));let response=rep?'「さっきもしましたよねぇ……」':score>=2?'「これはうれしいですねぇ。ありがとう」':score>=0?'「どうもありがとうね」':'「うーん、それはちょっと困りますねぇ」';if(j===p.like&&!p.known.includes(acts[j]+'が好き'))p.known.push(acts[j]+'が好き');if(j===p.dislike&&!p.known.includes(acts[j]+'が苦手'))p.known.push(acts[j]+'が苦手');note(p.name+'さん：'+response+' '+(n>=0?'+':'')+n+'円');modal(`<h2>${esc(p.name)}さんの反応</h2><p>${response}</p><h2>${n>=0?'+':''}${n}円</h2><p>${rep?'同じお世話の繰り返しには注意！':'好みや気分によって反応が変わります。'}</p><button onclick="visit(${i})">ほかのお世話をする</button><button onclick="close()">町に戻る</button>`);save()}function plot(i){if(s.plots[i]===0){if(!s.seeds){note('種が足りません。');render();return}s.seeds--;s.plots[i]=1;s.ready[i]=Date.now()+20000;note('畑に種をまきました。')}else if(s.plots[i]===1&&Date.now()>=s.ready[i]){s.plots[i]=0;let n=90+R(61);cash(n);note('野菜を出荷！ '+n+'円の売上。')}save();render()}function seed(){if(s.cash<40)return alert('お金が足りません');cash(-40);s.seeds+=2;save();render()}function buy(id,n){if(s.cash<n)return alert('お金が足りません');if(s.items.includes(id))return;cash(-n);s.items.push(id);s.bond+=id==='shogi'?12:5;note('町に新しい設備ができました。');render()}function expand(){let i=s.plots.indexOf(-1);if(i<0)return alert('今はこれ以上増やせません');if(s.cash<400)return alert('お金が足りません');cash(-400);s.plots[i]=0;note('畑を増やしました！');render()}function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='jiibaa-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.people)||!Array.isArray(v.plots))throw 1;if(confirm('今のデータを置き換えますか？')){s=v;save();render()}}catch{alert('読み込めませんでした')}};r.readAsText(i.files[0])};i.click()}function reset(){if(confirm('最初からやり直しますか？')){s=fresh();save();render()}}
const c=document.getElementById('cv'),g=c.getContext('2d');function poly(pts,color){g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=color;g.fill()}function oval(x,y,rx,ry,col){g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fillStyle=col;g.fill()}function text(s,x,y,size=14,color='#3e554b'){g.fillStyle=color;g.font=`bold ${size}px sans-serif`;g.textAlign='center';g.fillText(s,x,y)}function house(x,y,roof){poly([[x-62,y-26],[x,y-61],[x,y+38],[x-62,y+73]],'#f0ddc4');poly([[x,y-61],[x+62,y-26],[x+62,y+73],[x,y+38]],'#d8b99e');poly([[x-70,y-30],[x,y-77],[x+70,y-30],[x,y+8]],roof);poly([[x+16,y+25],[x+38,y+12],[x+38,y+65],[x+16,y+78]],'#8b7461');poly([[x-46,y-9],[x-24,y-22],[x-24,y+8],[x-46,y+21]],'#a4d1d7')}function person(p){let x=p.x,y=p.y;oval(x,y+7,19,6,'#71947266');g.fillStyle='#636b70';g.fillRect(x-11,y-6,8,20);g.fillRect(x+4,y-6,8,20);poly([[x-16,y-39],[x+16,y-39],[x+18,y-4],[x-18,y-4]],p.color);oval(x,y-53,19,21,'#eec5a7');oval(x,y-67,20,10,'#e1e1dc');if(p.sex==='♀'){oval(x-17,y-52,5,13,'#c3c5c0');oval(x+17,y-52,5,13,'#c3c5c0')}oval(x-7,y-54,1.8,2,'#454545');oval(x+7,y-54,1.8,2,'#454545');g.strokeStyle='#946d62';g.beginPath();g.arc(x,y-47,5,0.1,3);g.stroke();oval(x,y-83,28,10,'#fffdf4');text(p.name,x,y-79,11)}function draw(){g.fillStyle='#d4e8cc';g.fillRect(0,0,700,460);poly([[40,240],[350,60],[665,240],[350,422]],'#a8cfa1');poly([[50,280],[350,105],[650,280],[350,454]],'#e5d9bd');poly([[50,260],[350,85],[650,260],[350,434]],'#d8cbb1');house(215,176,'#b57f80');house(487,176,'#829fb0');poly([[95,341],[164,303],[232,340],[163,380]],'#9b815c');for(let i=0;i<2;i++){poly([[111+i*39,341-i*20],[134+i*39,327-i*20],[170+i*39,348-i*20],[147+i*39,362-i*20]],'#83a76c');if(s.plots[i]===1&&Date.now()>=s.ready[i])oval(150+i*39,342-i*20,8,7,'#dc7162')}text('畑',162,396);oval(350,317,59,32,'#a0c58e');g.fillStyle='#9e815d';g.fillRect(333,306,38,7);g.fillRect(338,312,5,13);g.fillRect(361,312,5,13);text('公園',350,288);if(s.items.includes('flower'))for(let i=0;i<7;i++)oval(560+i*12,330+i%2*8,6,6,i%2?'#e9a0ad':'#f0d479');if(s.items.includes('shogi')){g.fillStyle='#a17d52';g.fillRect(441,350,55,22);text('将棋',469,366,12,'white')}if(s.items.includes('lamp')){g.fillStyle='#647771';g.fillRect(587,248,5,72);oval(589,247,16,11,'#f8e9b0')}s.people.forEach(person);text('家や住人をタップして訪問',350,448,12)}let points=[[240,293],[465,295],[355,330],[350,260]];let prev=performance.now();function frame(now){let dt=Math.min((now-prev)/1000,.08);prev=now;s.people.forEach(p=>{if(p.pause>0){p.pause-=dt;return}let d=points[p.target],dx=d[0]-p.x,dy=d[1]-p.y,l=Math.hypot(dx,dy);if(l<4){p.pause=1+R(5);p.target=R(points.length)}else{p.x+=dx/l*22*dt;p.y+=dy/l*22*dt}});if(s.people.length>1){let a=s.people[0],b=s.people[1];if(Math.hypot(a.x-b.x,a.y-b.y)<50&&Date.now()-(s.meet||0)>30000){s.meet=Date.now();let happy=R(100)<(a.kind+b.kind)/2;s.bond=Math.max(-100,Math.min(100,s.bond+(happy?5:-3)));note(happy?`${a.name}さんと${b.name}さんが楽しそうに立ち話。`:`${a.name}さんと${b.name}さん、少し気まずそう。`)}}draw();requestAnimationFrame(frame)}c.addEventListener('click',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*700,y=(e.clientY-r.top)/r.height*460;let i=s.people.findIndex(p=>Math.abs(p.x-x)<30&&Math.abs(p.y-40-y)<70);if(i>=0)return visit(i);if(x<290&&y<290)return visit(0);if(x>405&&y<290)return visit(1);tab(x<245&&y>290?'farm':'people')});setInterval(()=>{save();if(current==='farm')render()},3000);addEventListener('pagehide',save);render();requestAnimationFrame(frame);
</script></html>
